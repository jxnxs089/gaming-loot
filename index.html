<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Items & Codes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Roblox Free Items & Redeem Codes</h1>
    <p>Hole dir hier die neuesten Items und schalte deine Promo-Codes frei!</p>
  </header>

  <main>
    <section class="item-grid">

      <!-- Item 1 -->
      <div class="item-card">
        <img src="https://via.placeholder.com/150" alt="Roblox Item">
        <h3>Cooler Roblox Hut</h3>
        <p>Löse diesen Code ein, um den exklusiven Hut im Spiel zu erhalten.</p>
        <div class="code-box">
          <code>ROBLOXHUT2026</code>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="item-card">
        <img src="https://via.placeholder.com/150" alt="Roblox Item">
        <h3>Exklusive Schulterbegleiter</h3>
        <p>Ein kostenloser Begleiter für deinen Avatar.</p>
        <div class="code-box">
          <code>PETCODE123</code>
        </div>
      </div>

    </section>
  </main>

</body>
</html>
